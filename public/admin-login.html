<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Administrator Security Portal | BrightPath Academy</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --muted: #9ca3af;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: #030712;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    header a { color: var(--muted); text-decoration: none; font-size: 0.9rem; }
    header a:hover { color: var(--text); }
    .badge-secure {
      background: #1e3a5f;
      color: #60a5fa;
      border: 1px solid #2563eb;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .main-wrap {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2.5rem 1rem;
    }
    .admin-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 460px;
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .shield-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 0.5rem;
    }
    h2 {
      text-align: center;
      font-size: 1.55rem;
      color: #f3f4f6;
      margin-bottom: 0.4rem;
    }
    p.security-notice {
      text-align: center;
      font-size: 0.85rem;
      color: var(--muted);
      margin-bottom: 1.8rem;
    }
    .tabs {
      display: flex;
      background: #030712;
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 1.5rem;
    }
    .tab-btn {
      flex: 1;
      padding: 9px;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: #1f2937;
      color: white;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: #d1d5db;
      margin-bottom: 0.4rem;
    }
    input {
      width: 100%;
      padding: 11px 13px;
      background: #030712;
      border: 1px solid #374151;
      border-radius: 8px;
      color: white;
      font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59,130,246,0.2);
    }
    button.btn-admin-submit {
      width: 100%;
      padding: 12px;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: background 0.2s;
    }
    button.btn-admin-submit:hover { background: var(--accent-hover); }
    .alert {
      padding: 11px 14px;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      font-size: 0.88rem;
      display: none;
      line-height: 1.4;
    }
    .alert-error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; display: block; }
    .alert-success { background: #064e3b; border: 1px solid #065f46; color: #6ee7b7; display: block; }
    .totp-box {
      background: #1e293b;
      border: 1px solid #334155;
      padding: 14px;
      border-radius: 8px;
      margin-bottom: 1.2rem;
      display: none;
    }
    .footer-links {
      margin-top: 1.5rem;
      text-align: center;
      font-size: 0.88rem;
    }
    .footer-links a { color: #94a3b8; text-decoration: none; }
    .footer-links a:hover { color: white; text-decoration: underline; }
  </style>
</head>
<body>
  <header>
    <div style="display: flex; align-items: center; gap: 10px;">
      <strong>🛡️ Admin Security Gateway</strong>
      <span class="badge-secure">Tier 1 Clearance</span>
    </div>
    <div>
      <a href="/login">User Portal</a> &bull;
      <a href="/">Home</a>
    </div>
  </header>

  <div class="main-wrap">
    <div class="admin-card">
      <div class="shield-icon">🔐</div>
      <h2>Administrator Portal</h2>
      <p class="security-notice">Authoritative access for school operational and academic controllers only.</p>

      <div class="tabs">
        <button type="button" id="tabLogin" class="tab-btn active" onclick="switchTab('login')">Admin Login</button>
        <button type="button" id="tabProvision" class="tab-btn" onclick="switchTab('provision')">Provision Admin</button>
      </div>

      <div id="alertBox" class="alert"></div>

      <!-- Login Panel -->
      <form id="adminLoginForm">
        <div class="form-group" id="loginUserGroup">
          <label for="adminUsername">Administrator Username or Email</label>
          <input type="text" id="adminUsername" placeholder="e.g. admin" required autofocus />
        </div>

        <div class="form-group" id="loginPwdGroup">
          <label for="adminPassword">Master Password</label>
          <input type="password" id="adminPassword" placeholder="••••••••" required />
        </div>

        <!-- Dynamic Admin 2FA Box -->
        <div id="adminTotpBox" class="totp-box">
          <label for="adminTotpCode">🔐 Enter 6-Digit Admin TOTP Code</label>
          <input type="text" id="adminTotpCode" placeholder="000000" maxlength="6" pattern="[0-9]{6}" />
          <p style="font-size: 0.8rem; color: #94a3b8; margin-top: 4px;">
            Open your authenticator app to retrieve the active 6-digit TOTP key.
          </p>
        </div>

        <button type="submit" id="adminSubmitBtn" class="btn-admin-submit">Authorize & Enter</button>
      </form>

      <!-- Provisioning Panel (Protected by Setup Secret or Active Admin Token) -->
      <form id="adminProvisionForm" style="display: none;">
        <div class="form-group">
          <label for="setupSecret">Bootstrap Authorization Secret</label>
          <input type="password" id="setupSecret" placeholder="Enter ADMIN_SETUP_SECRET" required />
        </div>
        <div class="form-group">
          <label for="newAdminUsername">New Admin Username</label>
          <input type="text" id="newAdminUsername" placeholder="e.g. principal_admin" required />
        </div>
        <div class="form-group">
          <label for="newAdminEmail">Admin Email Address</label>
          <input type="email" id="newAdminEmail" placeholder="admin@school.edu" required />
        </div>
        <div class="form-group">
          <label for="newAdminFirst">First Name</label>
          <input type="text" id="newAdminFirst" placeholder="First Name" required />
        </div>
        <div class="form-group">
          <label for="newAdminLast">Last Name</label>
          <input type="text" id="newAdminLast" placeholder="Last Name" required />
        </div>
        <div class="form-group">
          <label for="newAdminPwd">Secure Master Password (min 8 chars)</label>
          <input type="password" id="newAdminPwd" placeholder="••••••••" required />
        </div>

        <button type="submit" id="provisionBtn" class="btn-admin-submit" style="background: #2563eb;">Provision Administrator Account</button>
      </form>

      <div class="footer-links">
        <a href="/login">Are you a Teacher, Student, or Parent? Sign in here</a>
      </div>
    </div>
  </div>

  <script>
    let adminTempToken = null;
    const alertBox = document.getElementById('alertBox');
    const adminLoginForm = document.getElementById('adminLoginForm');
    const adminProvisionForm = document.getElementById('adminProvisionForm');
    const adminTotpBox = document.getElementById('adminTotpBox');
    const adminSubmitBtn = document.getElementById('adminSubmitBtn');

    function showAlert(msg, type = 'error') {
      alertBox.textContent = msg;
      alertBox.className = 'alert alert-' + type;
      alertBox.style.display = 'block';
    }

    function switchTab(tab) {
      alertBox.style.display = 'none';
      if (tab === 'login') {
        document.getElementById('tabLogin').classList.add('active');
        document.getElementById('tabProvision').classList.remove('active');
        adminLoginForm.style.display = 'block';
        adminProvisionForm.style.display = 'none';
      } else {
        document.getElementById('tabLogin').classList.remove('active');
        document.getElementById('tabProvision').classList.add('active');
        adminLoginForm.style.display = 'none';
        adminProvisionForm.style.display = 'block';
      }
    }

    // Admin Login Flow
    adminLoginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      // 2FA step
      if (adminTempToken) {
        const code = document.getElementById('adminTotpCode').value.trim();
        if (!code || code.length !== 6) {
          return showAlert('Please enter a valid 6-digit TOTP code.');
        }

        adminSubmitBtn.disabled = true;
        adminSubmitBtn.textContent = 'Verifying TOTP...';

        try {
          const res = await fetch('/api/auth/2fa/verify', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ tempToken: adminTempToken, code }),
          });
          const data = await res.json();
          if (!res.ok) {
            adminSubmitBtn.disabled = false;
            adminSubmitBtn.textContent = 'Verify TOTP & Enter';
            return showAlert(data.message || '2FA verification failed.');
          }

          localStorage.setItem('school_token', data.token);
          localStorage.setItem('school_user', JSON.stringify(data.user));
          window.location.href = '/admin/dashboard';
        } catch (err) {
          adminSubmitBtn.disabled = false;
          showAlert('Network error during admin 2FA verification.');
        }
        return;
      }

      // Password step
      const username = document.getElementById('adminUsername').value.trim();
      const password = document.getElementById('adminPassword').value;

      adminSubmitBtn.disabled = true;
      adminSubmitBtn.textContent = 'Authenticating...';

      try {
        const res = await fetch('/api/auth/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        const data = await res.json();

        if (!res.ok) {
          adminSubmitBtn.disabled = false;
          adminSubmitBtn.textContent = 'Authorize & Enter';
          return showAlert(data.message || 'Admin authentication failed.');
        }

        if (data.twoFactorRequired) {
          adminTempToken = data.tempToken;
          document.getElementById('loginPwdGroup').style.display = 'none';
          adminTotpBox.style.display = 'block';
          adminSubmitBtn.disabled = false;
          adminSubmitBtn.textContent = 'Verify TOTP & Enter';
          showAlert('Please enter your 6-digit TOTP key to complete administrator login.', 'success');
          document.getElementById('adminTotpCode').focus();
          return;
        }

        localStorage.setItem('school_token', data.token);
        localStorage.setItem('school_user', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard';
      } catch (err) {
        adminSubmitBtn.disabled = false;
        adminSubmitBtn.textContent = 'Authorize & Enter';
        showAlert('Network error connecting to administrative service.');
      }
    });

    // Admin Provisioning Flow
    adminProvisionForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';

      const payload = {
        setupSecret: document.getElementById('setupSecret').value.trim(),
        username: document.getElementById('newAdminUsername').value.trim(),
        email: document.getElementById('newAdminEmail').value.trim(),
        firstName: document.getElementById('newAdminFirst').value.trim(),
        lastName: document.getElementById('newAdminLast').value.trim(),
        password: document.getElementById('newAdminPwd').value,
      };

      const provisionBtn = document.getElementById('provisionBtn');
      provisionBtn.disabled = true;
      provisionBtn.textContent = 'Provisioning...';

      try {
        const res = await fetch('/api/auth/admin/provision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json();
        provisionBtn.disabled = false;
        provisionBtn.textContent = 'Provision Administrator Account';

        if (!res.ok) {
          return showAlert(data.message || 'Provisioning rejected.');
        }

        showAlert(data.message + ' You can now log in.', 'success');
        adminProvisionForm.reset();
        setTimeout(() => switchTab('login'), 2000);
      } catch (err) {
        provisionBtn.disabled = false;
        provisionBtn.textContent = 'Provision Administrator Account';
        showAlert('Network error during provisioning.');
      }
    });
  </script>
</body>
</html>
