<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password | BrightPath Academy</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f172a; color: white; padding: 1rem 2rem; }
    .main-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: var(--card); max-width: 440px; width: 100%; padding: 2.5rem 2rem; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
    p { color: #64748b; font-size: 0.92rem; margin-bottom: 1.5rem; text-align: center; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1.2rem; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .alert { padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
    .links { text-align: center; margin-top: 1.2rem; font-size: 0.9rem; }
    .links a { color: var(--primary); text-decoration: none; }
  </style>
</head>
<body>
  <header><strong>🏫 BrightPath Academy</strong></header>
  <div class="main-wrap">
    <div class="card">
      <h2>Password Recovery</h2>
      <p>Enter your registered email address to receive password reset instructions.</p>
      <div id="alertBox" class="alert"></div>
      <form id="forgotForm">
        <label for="email">Account Email</label>
        <input type="email" id="email" placeholder="user@school.edu" required />
        <button type="submit" id="submitBtn">Send Reset Link</button>
      </form>
      <div class="links">
        <a href="/login">Return to Login</a>
      </div>
    </div>
  </div>
  <script>
    const form = document.getElementById('forgotForm');
    const alertBox = document.getElementById('alertBox');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Sending...';
      try {
        const res = await fetch('/api/auth/forgot-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        alertBox.style.display = 'block';
        alertBox.style.background = '#dcfce7';
        alertBox.style.color = '#166534';
        alertBox.textContent = data.message;
        form.reset();
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#991b1b';
        alertBox.textContent = 'Network error.';
      }
    });
  </script>
</body>
</html>
