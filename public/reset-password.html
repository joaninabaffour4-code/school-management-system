<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password | Nina International</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card: #ffffff; --border: #cbd5e1; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: #0f172a; color: white; padding: 1rem 2rem; }
    .main-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
    .card { background: var(--card); max-width: 440px; width: 100%; padding: 2.5rem 2rem; border-radius: 14px; border: 1px solid var(--border); box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
    h2 { color: var(--primary); margin-bottom: 0.5rem; text-align: center; }
    p { color: #64748b; font-size: 0.92rem; margin-bottom: 1.5rem; text-align: center; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 0.4rem; }
    input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; margin-bottom: 1.2rem; }
    button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; }
    .alert { padding: 10px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 1rem; display: none; }
  </style>
</head>
<body>
  <header><strong>🏫 Nina International</strong></header>
  <div class="main-wrap">
    <div class="card">
      <h2>Set New Password</h2>
      <p>Enter your new password below.</p>
      <div id="alertBox" class="alert"></div>
      <form id="resetForm">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="newPassword" style="margin-bottom: 0;">New Password (min 8 chars)</label>
          <button type="button" onclick="togglePasswordVisibility('newPassword', this)" style="background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; font-weight: 600; color: #334155; cursor: pointer; width: auto;">
            👁️ View
          </button>
        </div>
        <input type="password" id="newPassword" placeholder="••••••••" required minlength="8" />

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
          <label for="confirmPassword" style="margin-bottom: 0;">Confirm New Password</label>
          <button type="button" onclick="togglePasswordVisibility('confirmPassword', this)" style="background: #e2e8f0; border: 1px solid #cbd5e1; border-radius: 4px; padding: 2px 8px; font-size: 0.78rem; font-weight: 600; color: #334155; cursor: pointer; width: auto;">
            👁️ View
          </button>
        </div>
        <input type="password" id="confirmPassword" placeholder="••••••••" required minlength="8" />
        <button type="submit" id="submitBtn">Update Password</button>
      </form>
      <div id="loginLinkArea" style="text-align: center; margin-top: 1.2rem; display: none;">
        <a href="/login" style="color: var(--primary); font-weight: 600; text-decoration: underline;">Proceed to Sign In</a>
      </div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('resetForm');
    const alertBox = document.getElementById('alertBox');
    const loginLinkArea = document.getElementById('loginLinkArea');

    if (!token) {
      alertBox.style.display = 'block';
      alertBox.style.background = '#fee2e2';
      alertBox.style.color = '#991b1b';
      alertBox.textContent = 'Missing password reset token. Please request a new link.';
      form.style.display = 'none';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (newPassword !== confirmPassword) {
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.style.color = '#991b1b';
        alertBox.textContent = 'Passwords do not match.';
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = 'Updating...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword }),
        });
        const data = await res.json();

        if (res.ok) {
          alertBox.style.display = 'block';
          alertBox.style.background = '#dcfce7';
          alertBox.style.color = '#166534';
          alertBox.textContent = data.message;
          form.style.display = 'none';
          loginLinkArea.style.display = 'block';
        } else {
          btn.disabled = false;
          btn.textContent = 'Update Password';
          alertBox.style.display = 'block';
          alertBox.style.background = '#fee2e2';
          alertBox.style.color = '#991b1b';
          alertBox.textContent = data.message || 'Reset failed.';
        }
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Update Password';
        alertBox.style.display = 'block';
        alertBox.style.background = '#fee2e2';
        alertBox.textContent = 'Network error.';
      }
    });

    function togglePasswordVisibility(id, btn) {
      const el = document.getElementById(id);
      if (!el) return;
      if (el.type === 'password') {
        el.type = 'text';
        btn.textContent = '🙈 Hide';
        btn.style.background = '#fef08a';
      } else {
        el.type = 'password';
        btn.textContent = '👁️ View';
        btn.style.background = '#e2e8f0';
      }
    }
  </script>
</body>
</html>
